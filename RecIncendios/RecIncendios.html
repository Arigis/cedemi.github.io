<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="./resources/ol.css">
        <link rel="stylesheet" href="resources/fontawesome-all.min.css">
        <link rel="stylesheet" type="text/css" href="resources/horsey.min.css">
        <link rel="stylesheet" type="text/css" href="resources/ol-search-layer.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <style>
        html, body {
            background-color: #ffffff;
        }
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Incendios</title>
    </head>
    <body>
    <div class="vertical-box">
        <p>MAPA DE INCENDIOS FORESTALES</p>
    </div>
    <div id="logo">
        <img src="images/logo.png" alt="Logotipo">
    </div>
    <div id="coord-search-container" class="ol-control">
    <button id="btn-toggle-coords" title="Buscar por coordenadas WGS84" type="button">📍</button>
    <div id="coord-inputs" style="display:none; background: white; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
    
    <div style="margin-bottom: 8px;">
        <!-- The 'for' attribute links this label to the input 'input-lat' -->
        <label for="input-lat" style="font-size: 11px; font-weight: bold; display: block; color: #333;">Latitud:</label>
        <input type="number" id="input-lat" step="any" placeholder="Ej: -17.5">
    </div>

    <div style="margin-bottom: 8px;">
        <!-- The 'for' attribute links this label to the input 'input-lon' -->
        <label for="input-lon" style="font-size: 11px; font-weight: bold; display: block; color: #333;">Longitud:</label>
        <input type="number" id="input-lon" step="any" placeholder="Ej: -64.5">
    </div>
    <button id="btn-go-to-coord" type="button" style="width: 100%; cursor: pointer;">Dibujar Punto</button>
    </div>
    </div>
    <div id="map">
        <div id="popup" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
        </div>
    </div>
        
    <div id="mouse-position" class="mouse-position-wrapper"></div>
        
        <script src="resources/qgis2web_expressions.js"></script>
        <script src="./resources/functions.js"></script>
        <script src="./resources/ol.js"></script>
        <script src="resources/horsey.min.js"></script>
        <script src="resources/ol-search-layer.js"></script>
        <script src="./resources/ol-layerswitcher.js"></script>
        <script src="resources/photon-geocoder-autocomplete.min.js"></script>
        <script src="layers/RegionesCochabamba_2.js"></script><script src="layers/Municipios_3.js"></script><script src="layers/RecIncendios_4.js"></script><script src="layers/Incendios20122025_5.js"></script>
        <script src="styles/RegionesCochabamba_2_style.js"></script><script src="styles/Municipios_3_style.js"></script><script src="styles/RecIncendios_4_style.js"></script><script src="styles/Incendios20122025_5_style.js"></script>
        <script src="./layers/layers.js" type="text/javascript"></script> 
        <script src="./resources/Autolinker.min.js"></script>
        <script src="./resources/qgis2web.js"></script>
        <script src="./resources/marker.js"></script>     
    </body>
</html>
